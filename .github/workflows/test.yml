name: tests
on: [push]

jobs:
  tests:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        install: rsync

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Pin Python to 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: python --version

    - run: npm install
    - run: npm ls

    - run: npm install -g nw-gyp prebuildify node-gyp

    - name: Ensure .NET Framework 3.5
      shell: pwsh
      run: |
        # Try to detect if .NET 3.5 is already installed
        $reg = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v3.5' -ErrorAction SilentlyContinue
        if ($reg -and $reg.Version -ne $null) {
          Write-Host ".NET Framework 3.5 already installed (version $reg.Version). Skipping."
          exit 0
        }

        Write-Host ".NET Framework 3.5 not detected. Listing candidate features..."
        $features = (dism.exe /Online /Get-Features /Format:Table) -join "`n"
        Write-Host $features

        # Try the known feature names in order
        $candidates = @('Net-Framework-Core', 'NetFx3-Setup', '.NET Framework 3.5')
        foreach ($name in $candidates) {
          Write-Host "Trying: $name"
          $result = dism.exe /Online /Enable-Feature /FeatureName:$name /All 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Installed .NET Framework 3.5 via '$name'."
            exit 0
          } else {
            Write-Host "Failed. Output: $result"
          }
        }

        # Not fatal — warn and continue
        Write-Warning "Could not install .NET Framework 3.5. Continuing anyway; failing only if a later step needs it."
        exit 0

    - run: ./make --build --build-cs
      env:
        MSYS2_ARG_CONV_EXCL: "*"

    - run: npm run test