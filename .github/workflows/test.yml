name: tests

on: [push]

jobs:
  tests:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          install: rsync

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm install
      - run: npm ls
      - run: npm install -g nw-gyp prebuildify node-gyp@9

      - name: Installer Python 2.7 pour nw-gyp
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          if (!(Test-Path 'C:\Python27\python.exe')) {
            throw 'Python 2.7 introuvable à C:\Python27\python.exe'
          }

      - run: powershell Install-WindowsFeature Net-Framework-Core

      - name: Compiler
        run: |
          cmd.exe /c "where node-gyp.cmd"
          cmd.exe /c "C:\Python27\python.exe --version"
          ./make --build --build-cs
          # Pour réactiver la signature, remplacer la ligne précédente par :
          # ./make --build --build-cs --sign
        env:
          PYTHON: 'C:\Python27\python.exe'
          npm_config_python: 'C:\Python27\python.exe'
          MSYS2_ARG_CONV_EXCL: '*'
          # SIGNING_SERVER: ${{ secrets.SIGNING_SERVER }}

      - run: npm run test

      - name: Déposer les binaires en artefact
        uses: actions/upload-artifact@v4
        with:
          name: winapi-unsigned
          path: |
            WinAPI.exe
            prebuilds/
          if-no-files-found: error
          retention-days: 14