name: tests
on: [push]

jobs:
  tests:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        install: rsync

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Pin Python to 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - run: python --version

    - run: npm install
    - run: npm ls

    - run: npm install -g nw-gyp prebuildify node-gyp

    - name: Ensure .NET Framework 3.5
      shell: pwsh
      run: |
        $state = (Get-WindowsOptionalFeature -Online -FeatureName Net-Framework-Core).State
        if ($state -ne 'Enabled') {
          Write-Host "Installing .NET Framework 3.5 via DISM..."
          dism.exe /Online /Enable-Feature /FeatureName:Net-Framework-Core /All
        } else {
          Write-Host ".NET Framework 3.5 already enabled."
        }

    - run: ./make --build --build-cs
      env:
        MSYS2_ARG_CONV_EXCL: "*"

    - run: npm run test